<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Jarvis Black Hole: a merging binary black hole, the live solar system, and a real-time Earth.">
<title>Jarvis Black Hole</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Syncopate:wght@700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
  /* One deliberate dark look: a black sky, glass controls, and the AI's accent colour (set by the palette). */
  :root{
    color-scheme:dark;
    --bg:#000;--ink:#e7f0eb;--dim:#93a69d;--faint:#5c6c65;
    --line:rgba(170,255,210,.13);--line2:rgba(170,255,210,.28);
    --glass:rgba(4,8,7,.62);--glass2:rgba(8,13,11,.9);
    --accent:#3dff95;--accent-ink:#03140b;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font:13px/1.45 "IBM Plex Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  canvas#c:active{cursor:grabbing}
  button{font:inherit;color:inherit}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---- top bar: wordmark + state, search, dropdown tabs ---- */
  .top{position:fixed;z-index:6;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,440px) minmax(0,1fr);align-items:center;gap:12px;transition:opacity .45s}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .mark{font:700 16px/1 Syncopate,"Arial Black",sans-serif;letter-spacing:.42em;color:#fff;text-shadow:0 0 22px color-mix(in srgb,var(--accent) 55%,transparent);white-space:nowrap}
  .state{display:flex;align-items:center;gap:8px;min-width:0;font:500 10.5px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .state i{width:7px;height:7px;flex:none;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .state b{color:var(--ink);font-weight:500}

  .search{position:relative;width:100%}
  .field{display:flex;align-items:center;gap:9px;height:38px;padding:0 8px 0 13px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .25s,box-shadow .25s}
  .field:focus-within{border-color:var(--line2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
  .field svg{flex:none;color:var(--dim)}
  .field input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--ink);font:14px "IBM Plex Sans",system-ui,sans-serif}
  .field input::placeholder{color:var(--faint)}
  .field input::-webkit-search-cancel-button{display:none}
  .go{flex:none;height:26px;padding:0 11px;border:0;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink);font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.14em;cursor:pointer}
  .go:hover{background:color-mix(in srgb,var(--accent) 28%,transparent)}
  .results{position:absolute;left:0;right:0;top:46px;padding:6px;border:1px solid var(--line2);border-radius:14px;background:var(--glass2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.55);max-height:min(60vh,420px);overflow:auto}
  .res{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;width:100%;padding:9px 10px;border:0;border-radius:9px;background:none;text-align:left;cursor:pointer}
  .res:hover,.res:focus-visible,.res.on{background:rgba(255,255,255,.055);outline:none}
  .res i{grid-row:span 2;width:8px;height:8px;margin-top:6px;border-radius:50%;border:1.5px solid var(--accent)}
  .res b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res span{color:var(--faint);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note{padding:10px 12px;color:var(--dim);font-size:12.5px}
  .note b{color:var(--ink);font-weight:500}

  .tabs{display:flex;gap:6px;justify-self:end;align-items:center}
  .dd{position:relative}
  .tab{height:38px;display:flex;align-items:center;gap:7px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--dim);font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.13em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:color .2s,border-color .2s}
  .tab b{color:var(--ink);font-weight:500}
  .tab svg{opacity:.7;transition:transform .2s}
  .tab:hover,.tab[aria-expanded="true"]{color:var(--ink);border-color:var(--line2)}
  .tab[aria-expanded="true"] svg{transform:rotate(180deg)}
  .icon{width:38px;justify-content:center;padding:0}
  .menu{position:absolute;right:0;top:46px;min-width:250px;padding:6px;border:1px solid var(--line2);border-radius:14px;background:var(--glass2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.55);max-height:calc(100vh - 90px);overflow:auto}
  .lbl{padding:9px 10px 5px;font:500 9.5px "IBM Plex Mono",monospace;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
  .opt{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:7px 10px;border:0;border-radius:9px;background:none;color:var(--dim);font:13px "IBM Plex Sans",system-ui,sans-serif;text-align:left;cursor:pointer}
  .opt:hover,.opt:focus-visible{background:rgba(255,255,255,.055);color:var(--ink);outline:none}
  .opt[aria-checked="true"]{color:var(--ink)}
  .ck{width:14px;height:14px;flex:none;border-radius:50%;border:1px solid var(--line2)}
  .opt[aria-checked="true"] .ck{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 38%,transparent 44%)}
  .tg{width:26px;height:15px;flex:none;border-radius:999px;border:1px solid var(--line2);position:relative;transition:background .2s,border-color .2s}
  .tg::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
  .opt[aria-checked="true"] .tg{background:color-mix(in srgb,var(--accent) 25%,transparent);border-color:var(--accent)}
  .opt[aria-checked="true"] .tg::after{transform:translateX(11px);background:var(--accent)}
  .sw{width:14px;height:14px;flex:none;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .meta{margin-left:auto;padding-left:10px;font:10.5px "IBM Plex Mono",monospace;color:var(--faint);letter-spacing:.04em;white-space:nowrap}
  .sep{height:1px;margin:6px 6px;background:var(--line)}
  .info{padding:4px 10px 8px;color:var(--faint);font-size:12px;line-height:1.5}
  .info b{color:var(--dim);font-weight:500}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;padding:4px 10px 8px;font-size:12px;color:var(--dim)}
  .keys kbd{justify-self:start}
  kbd{font:500 10px "IBM Plex Mono",monospace;color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;background:rgba(255,255,255,.03)}
  .field kbd{color:var(--faint);border-color:var(--line)}

  /* ---- bottom: where you are, and credits ---- */
  .hud{position:fixed;z-index:4;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:18px;pointer-events:none;transition:opacity .45s}
  .readout{font:500 10.5px/1.7 "IBM Plex Mono",monospace;letter-spacing:.09em;color:var(--dim);text-transform:uppercase;text-shadow:0 1px 10px #000;font-variant-numeric:tabular-nums}
  .readout b{display:block;color:var(--ink);font-weight:500;letter-spacing:.15em;font-size:11.5px}
  .credits{font:10px/1.55 "IBM Plex Mono",monospace;color:var(--faint);text-align:right;max-width:52ch;text-shadow:0 1px 8px #000}
  .stats{position:fixed;z-index:4;right:16px;top:calc(62px + env(safe-area-inset-top,0px));font:10px/1.7 "IBM Plex Mono",monospace;letter-spacing:.1em;color:var(--faint);text-align:right;text-transform:uppercase;pointer-events:none;font-variant-numeric:tabular-nums}
  .stats em{font-style:normal;color:var(--accent)}
  .toast{position:fixed;z-index:7;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px));padding:10px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--glass2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--dim);font-size:12.5px;line-height:1.5;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .toast b{color:var(--ink);font-weight:500}

  .gpu{position:fixed;z-index:8;right:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100vw - 32px));padding:14px 16px 12px;border:1px solid color-mix(in srgb,#ffb347 45%,transparent);border-radius:14px;background:var(--glass2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 18px 50px rgba(0,0,0,.55);font-size:12.5px;line-height:1.55;color:var(--dim)}
  .gpu b{display:block;margin-bottom:6px;color:#ffd08a;font-weight:600}
  .gpu p{margin:0 0 10px}
  .gpu code{font:11px "IBM Plex Mono",monospace;color:var(--ink);background:rgba(255,255,255,.05);padding:1px 5px;border-radius:4px}
  .gpu button{height:28px;padding:0 12px;border:1px solid var(--line2);border-radius:999px;background:none;color:var(--ink);font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.12em;cursor:pointer}
  /* ---- labels projected onto the scene ---- */
  .labels{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
  .pl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;font:500 9.5px "IBM Plex Mono",monospace;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 6px #000;will-change:transform}
  .pl i{width:9px;height:9px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 70%,transparent)}
  .pl em{font-style:normal;color:var(--faint)}
  .pl.pin i{width:11px;height:11px;border:2px solid var(--accent);box-shadow:0 0 12px var(--accent)}
  .pl.pin{color:var(--ink)}

  body.idle .top,body.idle .hud,body.idle .labels,body.clean .top,body.clean .hud,body.clean .labels,body.clean .stats{opacity:0;pointer-events:none}
  body.idle .top *,body.clean .top *{pointer-events:none}

  .tab .val:empty{display:none}
  /* ---- map overlays: the picked building, routes, your landmarks ---- */
  canvas#c.pick{cursor:crosshair}
  .overlay{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
  #pickPath{fill:color-mix(in srgb,var(--accent) 14%,transparent);fill-rule:evenodd;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 70%,transparent))}
  #pickDot{fill:#fff;stroke:var(--accent);stroke-width:2}
  #routePath{fill:none;stroke:#7fd3ff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(127,211,255,.8))}
  #routePath.est{stroke-dasharray:6 7}
  #routeAlt{fill:none;stroke:rgba(190,225,255,.42);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 5}
  #routeA{fill:#fff;stroke:#7fd3ff;stroke-width:2.5}#routeB{fill:#7fd3ff;stroke:#fff;stroke-width:2.5}
  .pl.me i{width:10px;height:10px;border:0;border-radius:2px;transform:rotate(45deg);background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .pl.me{color:var(--ink)}.pl.me em{color:var(--dim)}
  .pl.lm i{width:8px;height:8px;border:1.5px solid #7fd3ff;background:rgba(127,211,255,.25)}
  .pl.lm{color:#cfe9ff}

  .rbadge{position:fixed;left:0;top:0;z-index:3;width:30px;height:30px;pointer-events:none}
  .rbadge>div{position:absolute;left:50%;bottom:50%;transform:translateX(-50%);width:64px;height:64px;display:grid;place-items:center;border-radius:18px;
    background:radial-gradient(circle at 50% 35%,#1a2a33,#070b0e 75%);border:1.5px solid #7fd3ff;box-shadow:0 0 0 4px rgba(127,211,255,.14),0 10px 24px rgba(0,0,0,.65);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
  .rbadge>div::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:#070b0e;border-right:1.5px solid #7fd3ff;border-bottom:1.5px solid #7fd3ff;transform:translateX(-50%) rotate(45deg)}
  .rbadge svg{width:54px;height:54px;overflow:visible}
  .rbadge[data-m="walk"] svg{width:40px;height:54px}
  @keyframes pop{from{opacity:0;scale:.4}to{opacity:1;scale:1}}
  body.clean .rbadge{display:none!important}
  /* ---- shared panel parts ---- */
  .sheet{border:1px solid var(--line2);border-radius:16px;background:var(--glass2);backdrop-filter:blur(20px) saturate(1.15);-webkit-backdrop-filter:blur(20px) saturate(1.15);
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 24px 64px -12px rgba(0,0,0,.7)}
  .xbtn{position:absolute;top:12px;right:12px;width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.03);color:var(--dim);cursor:pointer}
  .xbtn:hover{color:var(--ink);border-color:var(--line2)}
  .pb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 13px;border:1px solid var(--line2);border-radius:999px;background:rgba(255,255,255,.03);
    color:var(--ink);font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s}
  .pb:hover{background:rgba(255,255,255,.07);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .pb.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .pb.pri:hover{background:color-mix(in srgb,var(--accent) 85%,#fff)}
  .pb[disabled]{opacity:.4;cursor:default}
  .pb.wide{width:100%;height:38px}
  .spin{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--accent) 30%,transparent);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---- place card ---- */
  .place{position:fixed;z-index:5;right:16px;top:calc(66px + env(safe-area-inset-top,0px));width:min(376px,calc(100vw - 32px));max-height:calc(100vh - 150px);overflow:auto;padding:20px 20px 16px;animation:rise .28s cubic-bezier(.2,.8,.2,1);scrollbar-width:thin}
  .place::before{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7}
  .pk{display:flex;align-items:center;gap:8px;padding-right:36px;font:500 10px/1.3 "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  .pn{margin:9px 0 0;padding-right:28px;font:600 21px/1.22 "IBM Plex Sans",system-ui,sans-serif;letter-spacing:-.01em;color:#fff;text-wrap:balance}
  .pp{margin:10px 0 0;color:var(--dim);font-size:13px;line-height:1.55}
  .pd{margin:16px 0 0;display:grid;border-top:1px solid var(--line)}
  .pr{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
  .pr dt{font:500 9.5px "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .pr dd{margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0;font-size:13.5px;color:var(--ink);line-height:1.45}
  .pr dd span,.pr dd a{min-width:0;overflow-wrap:anywhere}
  .pr dd a{color:var(--ink);text-decoration:none;font-variant-numeric:tabular-nums}.pr dd a:hover{color:var(--accent)}
  .dimv{color:var(--faint)}
  .pc{flex:none;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--dim);font:500 9.5px "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  .pc:hover{color:var(--ink);border-color:var(--line2)}
  .pa{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.pa2{margin-top:8px}
  .pl2{margin:18px 0 6px;font:500 9.5px "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .pos{display:grid;gap:2px;margin:0 -8px}
  .po{display:flex;justify-content:space-between;gap:12px;width:100%;padding:8px;border:0;border-radius:9px;background:none;color:var(--ink);font:13px "IBM Plex Sans",system-ui,sans-serif;text-align:left;cursor:pointer}
  .po:hover{background:rgba(255,255,255,.055)}
  .po em{font-style:normal;color:var(--faint);font-size:12px;white-space:nowrap}
  .pm{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line);font:10.5px/1.55 "IBM Plex Mono",monospace;color:var(--faint)}

  /* ---- places panel: routes and landmarks ---- */
  .routes{position:fixed;z-index:5;left:16px;top:calc(66px + env(safe-area-inset-top,0px));width:min(360px,calc(100vw - 32px));max-height:calc(100vh - 150px);overflow:auto;padding:18px;animation:rise .28s cubic-bezier(.2,.8,.2,1);scrollbar-width:thin}
  .rh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .rh h2{margin:0;font:700 12px/1 Syncopate,"Arial Black",sans-serif;letter-spacing:.34em;color:#fff}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;margin-bottom:16px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.02)}
  .seg button{height:30px;border:0;border-radius:999px;background:none;color:var(--dim);font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
  .seg button[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink)}
  .fl{display:block;margin:0 0 6px;font:500 9.5px "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .sel{position:relative;margin-bottom:12px}
  .sel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);transform:translateY(-70%) rotate(45deg);pointer-events:none}
  .sel select,.lmf input{width:100%;height:38px;padding:0 34px 0 13px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.035);color:var(--ink);font:13.5px "IBM Plex Sans",system-ui,sans-serif;appearance:none;-webkit-appearance:none;outline:0}
  .sel select:focus,.lmf input:focus{border-color:var(--line2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
  .sel option{background:#0b100e;color:var(--ink)}
  .swap{display:block;margin:-6px auto 4px;width:30px;height:24px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--dim);cursor:pointer}
  .swap:hover{color:var(--ink);border-color:var(--line2)}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:4px 0 12px}
  .chip{height:32px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--dim);font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  .chip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .rr{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}
  .rk{display:flex;align-items:center;gap:8px;font:500 9.5px "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  .rt{display:flex;align-items:baseline;gap:10px;margin-top:8px}.rt b{font:500 26px/1 "IBM Plex Mono",monospace;color:#fff;font-variant-numeric:tabular-nums}.rt span{color:var(--dim);font-size:13px}
  .rw{margin-top:6px;color:var(--dim);font-size:12.5px}.rw i{font-style:normal;color:var(--faint);margin:0 4px}
  .oms{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:12px}
  .om{display:grid;gap:3px;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:none;color:var(--dim);text-align:left;cursor:pointer;font:10px "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
  .om b{font:500 12.5px "IBM Plex Mono",monospace;letter-spacing:0;color:var(--ink);text-transform:none}
  .om:hover{border-color:var(--line2)}

  /* ---- weather pill (matches Punch In) ---- */
  .wx-pill{--hairline:var(--line2);--hairline-soft:var(--line);--ink-faint:var(--faint);--ink-dim:var(--dim);--cherry:var(--accent);

    .search{width:calc(100% - 92px)}
    .tab .val{display:none}
    .place,.routes{top:calc(116px + env(safe-area-inset-top,0px));max-height:calc(100vh - 196px)}
  }
  @media (max-width:900px){
    .place,.routes{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:16px;right:16px;width:auto;max-height:52vh}

    .place:not([hidden])~.rpop{display:none}
  }
  .wx-pop{position:absolute;top:calc(100% + 9px);left:0;transform:translateY(-5px);width:min(360px,calc(100vw - 32px));text-align:left;background:rgba(6,10,9,.96);border:1px solid var(--hairline);border-radius:14px;
    box-shadow:0 2px 3px rgba(0,0,0,.4),0 22px 48px -22px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06);padding:14px 16px 15px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9;cursor:default}
  .wx-pill:hover .wx-pop,.wx-pill:focus-within .wx-pop,.wx-pill.open .wx-pop{opacity:1;transform:translateY(0);pointer-events:auto}
  .wx-pop-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .wx-pop-place{font:600 15px Fraunces,Georgia,serif;color:var(--ink)}
  .wx-pop-obs{font:10.5px "IBM Plex Mono",monospace;color:var(--ink-faint)}
  .wx-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;margin-bottom:11px}
  .wx-cell{display:flex;justify-content:space-between;gap:8px;font-size:12px}.wx-cell span:first-child{color:var(--ink-faint)}.wx-cell span:last-child{font-family:"IBM Plex Mono",monospace;color:var(--ink);white-space:nowrap}
  .wx-periods{border-top:1px dashed var(--hairline-soft);padding-top:10px;display:flex;flex-direction:column;gap:8px}
  .wx-period-name{font:700 8.5px Syncopate,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--cherry);margin-bottom:2px}
  .wx-period-text{font-size:11.5px;color:var(--ink-dim);line-height:1.45}.wx-period-temp{font-family:"IBM Plex Mono",monospace;color:var(--ink)}
  .wx-src{margin-top:10px;padding-top:9px;border-top:1px dashed var(--hairline-soft);font-size:10.5px;color:var(--ink-faint);line-height:1.4}
  .wx-hourly{border-top:1px dashed var(--hairline-soft);padding-top:10px;margin-top:10px}
  .wx-hourly-title{font:700 8.5px Syncopate,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--cherry);margin-bottom:7px}
  .wx-hourly-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
  .wx-hour{min-width:0;text-align:center;padding:6px 3px;border:1px solid var(--hairline-soft);border-radius:8px;background:rgba(255,255,255,.025)}
  .wx-hour-time{font:9px "IBM Plex Mono",monospace;color:var(--ink-faint)}.wx-hour-icon{height:18px;margin:4px 0;display:flex;justify-content:center}
  .wx-hour-temp{font:11px "IBM Plex Mono",monospace;color:var(--ink)}.wx-hour-detail{font-size:9px;color:var(--ink-dim);margin-top:3px}

  body.clean .place,body.clean .routes,body.clean .rpop,body.clean .overlay{display:none!important}

  @media (max-width:1400px){
    .top{grid-template-columns:minmax(0,1fr) auto}
    .search{grid-column:1/-1;grid-row:2}
    .state span{display:none}
  }
  @media (max-width:900px){
    .top{grid-template-columns:minmax(0,1fr)}
    .tabs{grid-row:3;justify-self:stretch;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
    .tabs::-webkit-scrollbar{display:none}
    .tab{padding:0 11px;flex:none}
    .state span{display:none}
    .mark{font-size:14px;letter-spacing:.34em}
    .credits{display:none}
    .menu{position:fixed;left:16px;right:16px;top:calc(162px + env(safe-area-inset-top,0px));min-width:0;max-height:calc(100vh - 190px)}
    .stats{top:calc(166px + env(safe-area-inset-top,0px))}
    .toast{top:calc(166px + env(safe-area-inset-top,0px))}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<canvas id="c" aria-label="A merging pair of black holes harnessed by an AI, beside a real-time, true-scale model of the solar system with a satellite-imaged Earth"></canvas>
<svg class="overlay" id="pickSvg" aria-hidden="true"><path id="routeAlt"/><path id="routePath"/><circle id="routeA" r="6" visibility="hidden"/><circle id="routeB" r="7" visibility="hidden"/><path id="pickPath"/><circle id="pickDot" r="4.5"/></svg>

    <div class="mark">JARVIS</div>

    <div class="wx-pill" id="wx" tabindex="0" role="button" aria-label="Weather in Ephrata, PA" hidden><span id="wxIcon"></span><span class="wx-temp" id="wxTemp">--°</span><span class="wx-place-mini" id="wxPlace"></span><div class="wx-pop" id="wxPop"></div></div>

</aside>

<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script>
window.__EARTH=(()=>{const B="https://cdn.jsdelivr.net/npm/three-globe@2.45.2/example/";return{day:B+"img/earth-blue-marble.jpg",lights:B+"img/earth-night.jpg",water:B+"img/earth-water.png",topo:B+"img/earth-topology.png",clouds:B+"clouds/clouds.png"};})();
// night lights: isolate the lights with the red channel; clouds: the PNG's alpha is the cloud cover
window.__prepEarth=(src,kind)=>new Promise(res=>{const im=new Image();im.crossOrigin="anonymous";im.onload=()=>{try{
  const c=document.createElement("canvas");c.width=im.width;c.height=im.height;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0);
  const d=x.getImageData(0,0,c.width,c.height),a=d.data;
  for(let i=0;i<a.length;i+=4){const v=kind==="lights"?Math.max(0,Math.min(255,(a[i]-16)/96*255)):a[i+3];a[i]=a[i+1]=a[i+2]=v;a[i+3]=255;}
  x.putImageData(d,0,0);res(c);}catch(e){res(null);}};im.onerror=()=>res(null);im.src=src;});
</script>
<script src="app.js"></script>
